<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#E6E8EC">
<meta name="description" content="Boards, progress blocks and project files for the Captain Rex cosplay build.">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Rex Workshop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..700&family=IBM+Plex+Mono:wght@400;500;600&family=Instrument+Sans:wght@400..700&display=swap">
<style>
:root{
  --ground:#E6E8EC; --col:#F1F2F5; --card:#FFFFFF; --sheet:#FFFFFF; --field:#F5F6F8;
  --ink:#16181D; --ink-2:#3B404B; --muted:#687080; --muted-2:#A2A8B4;
  --line:#DCDFE5; --line-strong:#BFC4CE; --hover:rgba(22,26,40,.06);
  --accent:#2563D9; --accent-ink:#FFFFFF; --accent-soft:rgba(37,99,217,.10);
  --danger:#C23B2E; --warn:#A86E12; --good:#2E8A55;
  --toast-accent:#9CC8FF; --scrim:rgba(14,16,22,.36);
  --shadow-card:0 1px 2px rgba(22,26,40,.07),0 0 0 1px rgba(22,26,40,.055);
  --shadow-hover:0 3px 8px -2px rgba(22,26,40,.12),0 0 0 1px rgba(22,26,40,.08);
  --shadow-lift:0 22px 44px -14px rgba(22,26,40,.38),0 0 0 1px rgba(22,26,40,.07);
  --l-moss:#4C8638; --l-mustard:#BE930C; --l-rust:#C9532B; --l-ultra:#3B5BDB; --l-orchid:#9A4CB6; --l-teal:#1C8B82; --l-rose:#C2416B; --l-sky:#2B87C2; --l-slate:#5D6B82; --l-lime:#6E9A1F;
  --r-card:10px; --r-col:14px;
  --col-w:min(300px, calc(100vw - 76px));
  --font-ui:"Instrument Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-display:"Bricolage Grotesque","Instrument Sans",system-ui,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#0E1014; --col:#16191F; --card:#1F232B; --sheet:#1A1D24; --field:#22262E;
    --ink:#E8EAEF; --ink-2:#C3C8D2; --muted:#8C93A2; --muted-2:#59606E;
    --line:#2A2F39; --line-strong:#3D4350; --hover:rgba(255,255,255,.07);
    --accent:#5E9BFF; --accent-ink:#0E1014; --accent-soft:rgba(94,155,255,.14);
    --danger:#FF7B6C; --warn:#E2B04A; --good:#5CC48A;
    --toast-accent:#2563D9; --scrim:rgba(0,0,0,.55);
    --shadow-card:0 0 0 1px rgba(255,255,255,.05),0 1px 2px rgba(0,0,0,.45);
    --shadow-hover:0 0 0 1px rgba(255,255,255,.09),0 4px 10px -2px rgba(0,0,0,.5);
    --shadow-lift:0 24px 48px -12px rgba(0,0,0,.75),0 0 0 1px rgba(255,255,255,.09);
    --l-moss:#7DB867; --l-mustard:#E0BA3E; --l-rust:#EE7C52; --l-ultra:#7C95FF; --l-orchid:#C783E0; --l-teal:#4CC2B6; --l-rose:#F07AA0; --l-sky:#6CC0F0; --l-slate:#9AA7BD; --l-lime:#A9D45A;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --ground:#0E1014; --col:#16191F; --card:#1F232B; --sheet:#1A1D24; --field:#22262E;
  --ink:#E8EAEF; --ink-2:#C3C8D2; --muted:#8C93A2; --muted-2:#59606E;
  --line:#2A2F39; --line-strong:#3D4350; --hover:rgba(255,255,255,.07);
  --accent:#5E9BFF; --accent-ink:#0E1014; --accent-soft:rgba(94,155,255,.14);
  --danger:#FF7B6C; --warn:#E2B04A; --good:#5CC48A;
  --toast-accent:#2563D9; --scrim:rgba(0,0,0,.55);
  --shadow-card:0 0 0 1px rgba(255,255,255,.05),0 1px 2px rgba(0,0,0,.45);
  --shadow-hover:0 0 0 1px rgba(255,255,255,.09),0 4px 10px -2px rgba(0,0,0,.5);
  --shadow-lift:0 24px 48px -12px rgba(0,0,0,.75),0 0 0 1px rgba(255,255,255,.09);
  --l-moss:#7DB867; --l-mustard:#E0BA3E; --l-rust:#EE7C52; --l-ultra:#7C95FF; --l-orchid:#C783E0; --l-teal:#4CC2B6; --l-rose:#F07AA0; --l-sky:#6CC0F0; --l-slate:#9AA7BD; --l-lime:#A9D45A;
  color-scheme:dark;
}

*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--ground);color:var(--ink);font:400 15px/1.4 var(--font-ui);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overscroll-behavior:none;overflow:hidden;touch-action:manipulation}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--accent)}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

#app{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--ground)}

/* ---------- header & navigation ---------- */
.top{flex:none;display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top,0px) + 8px) max(10px,env(safe-area-inset-right,0px)) 6px max(14px,env(safe-area-inset-left,0px))}
.brand{flex:1;min-width:0;display:flex;align-items:center;gap:10px}
.brand-mark{flex:none;width:34px;height:34px;border-radius:9px;box-shadow:var(--shadow-card)}
.brand>div{min-width:0}
.brand b{display:block;font:700 18px/1.1 var(--font-display);letter-spacing:-.015em;white-space:nowrap}
.brand small{display:block;margin-top:2px;font:500 11.5px/1.2 var(--font-mono);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sync-pill{flex:none;display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 12px 0 11px;border:0;border-radius:999px;background:var(--hover);color:var(--ink-2);font:600 12.5px/1 var(--font-ui);cursor:pointer;white-space:nowrap}
.sync-pill i{width:8px;height:8px;border-radius:50%;background:var(--muted-2)}
.sync-pill.ok i{background:var(--good)}
.sync-pill.busy i{background:var(--accent);animation:pulse 1s ease-in-out infinite}
.sync-pill.warn i{background:var(--warn)}
.sync-pill.err{color:var(--danger)} .sync-pill.err i{background:var(--danger)}
.sync-pill.off{background:var(--accent);color:var(--accent-ink)} .sync-pill.off i{background:var(--accent-ink)}
@keyframes pulse{50%{opacity:.3}}
main{flex:1;min-height:0;position:relative}
.view{position:absolute;inset:0;display:flex;flex-direction:column}
.scroll{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior-y:contain;scrollbar-width:thin;scrollbar-color:var(--line-strong) transparent}
.bnav{flex:none;display:flex;gap:4px;padding:5px max(10px,env(safe-area-inset-right,0px)) calc(5px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px));background:var(--sheet);box-shadow:0 -1px 0 var(--line)}
.bnav button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;height:54px;border:0;border-radius:12px;background:none;color:var(--muted);font:600 12px/1 var(--font-ui);cursor:pointer}
.bnav button .ic{width:22px;height:22px}
.bnav button.on{color:var(--accent)}
.bnav button.on .ic{stroke-width:2.1}
.seg{display:flex;padding:3px;border-radius:12px;background:var(--hover)}
.seg button{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:7px;height:38px;padding:0 14px;border:0;border-radius:9px;background:none;color:var(--muted);font:600 14.5px/1 var(--font-ui);cursor:pointer;white-space:nowrap}
.seg button .ic{width:17px;height:17px}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow-card)}
.top .views{display:none}
@media (min-width:900px) and (hover:hover) and (pointer:fine){
  .top{padding:12px 18px 8px 20px;gap:14px}
  .top .views{display:flex;flex:none}
  .bnav{display:none}
}

/* ---------- board tabs ---------- */
.tabs{flex:none;display:flex;align-items:center;gap:2px;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;padding:0 8px 0 10px;-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 10px,#000 calc(100% - 20px),transparent);mask-image:linear-gradient(90deg,transparent 0,#000 10px,#000 calc(100% - 20px),transparent)}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;position:relative;display:inline-flex;align-items:center;gap:7px;height:44px;padding:0 10px;border:0;border-radius:10px;background:none;color:var(--muted);font:500 16.5px/1 var(--font-display);letter-spacing:-.012em;cursor:pointer;white-space:nowrap;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.tab:hover{color:var(--ink)}
.tab.is-active{color:var(--ink);font-weight:700}
.tab.is-active::after{content:"";position:absolute;left:10px;right:10px;bottom:5px;height:2.5px;border-radius:2px;background:var(--ink)}
.tab-dot{width:8px;height:8px;border-radius:50%;background:var(--c);flex:none}
.tab-count{font:500 11px/1 var(--font-mono);color:var(--muted);align-self:flex-start;margin-top:10px;font-variant-numeric:tabular-nums}
.tab.is-pressing{background:var(--hover)}
.tab-add{flex:none;width:38px;height:38px;display:grid;place-items:center;border:0;border-radius:10px;background:none;color:var(--muted);cursor:pointer}
.tab-add:hover{background:var(--hover);color:var(--ink)}

/* ---------- board ---------- */
.board{flex:1;min-height:0;display:flex;align-items:flex-start;gap:12px;overflow-x:auto;overflow-y:hidden;position:relative;padding:8px 16px 14px;scroll-snap-type:x proximity;scroll-padding-inline:16px;overscroll-behavior-x:contain;scrollbar-width:thin;scrollbar-color:var(--line-strong) transparent}
.board-end{flex:0 0 4px;height:1px}
html.dragging .board,html.dragging .tabs{scroll-snap-type:none}
html.dragging,html.dragging *{cursor:grabbing!important}
.list{flex:0 0 var(--col-w);width:var(--col-w);max-height:100%;display:flex;flex-direction:column;background:var(--col);border-radius:var(--r-col);scroll-snap-align:start;position:relative}
.list-head{flex:none;display:flex;align-items:center;min-height:54px;padding:6px 4px 2px 6px;cursor:grab;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.list-title{flex:1;min-width:0;text-align:left;border:0;background:none;padding:7px 8px;border-radius:8px;color:var(--ink);font:650 17px/1.2 var(--font-display);letter-spacing:-.015em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.list-title:hover{background:var(--hover)}
.list-title-input{flex:1;min-width:0;border:0;outline:none;border-radius:8px;padding:7px 8px;background:var(--card);box-shadow:0 0 0 2px var(--accent);font:650 17px/1.2 var(--font-display);letter-spacing:-.015em;color:var(--ink)}
.list-count{flex:none;font:500 12px/1 var(--font-mono);color:var(--muted);padding:0 6px;font-variant-numeric:tabular-nums}
.list-done-ic{color:var(--good);display:grid;margin-left:-2px}
.list-done-ic .ic{width:16px;height:16px}
.list-head.is-pressing{background:var(--hover);border-radius:12px}
.cards{flex:0 1 auto;min-height:8px;overflow-y:auto;overflow-x:hidden;overscroll-behavior-y:contain;display:flex;flex-direction:column;gap:6px;padding:2px 8px 6px;position:relative;scrollbar-width:thin;scrollbar-color:var(--line-strong) transparent}
.card{flex:none;position:relative;display:flex;flex-direction:column;gap:7px;padding:10px 12px 11px 8px;background:var(--card);border-radius:var(--r-card);box-shadow:var(--shadow-card);cursor:grab;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;transition:transform .16s ease,box-shadow .16s ease}
.card:focus-visible{outline:none;box-shadow:var(--shadow-card),0 0 0 2px var(--accent)}
@media (hover:hover){.card:hover{box-shadow:var(--shadow-hover)}}
.card.is-pressing,.step.is-pressing{transform:scale(.975)}
.card-labels{display:flex;flex-wrap:wrap;align-items:center;gap:4px;padding-left:34px}
.lab{display:block;padding:3px 7px;border-radius:5px;background:color-mix(in srgb,var(--c) 17%,transparent);color:color-mix(in srgb,var(--c) 72%,var(--ink));font:600 11.5px/1.2 var(--font-ui)}
.card-main{display:flex;align-items:flex-start;gap:8px}
.card-title{flex:1;min-width:0;font-size:15px;line-height:1.35;padding-top:1px;overflow-wrap:anywhere}
.card.is-done .card-title{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--muted-2)}
.card-meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;padding-left:34px}
.chip{display:inline-flex;align-items:center;gap:4px;font:500 11.5px/1 var(--font-mono);color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.chip .ic{width:14px;height:14px}
.chip.late{color:var(--danger)} .chip.soon{color:var(--warn)} .chip.ok{color:var(--good)}
.chip.pin{color:var(--warn)}
.chip.blk{color:color-mix(in srgb,var(--c) 75%,var(--ink));max-width:150px;overflow:hidden;text-overflow:ellipsis}
.check{flex:none;position:relative;width:26px;height:26px;margin:-3px 0;padding:0;display:grid;place-items:center;border:0;background:none;border-radius:50%;color:transparent;cursor:pointer}
.check::before{content:"";position:absolute;inset:3px;border-radius:50%;border:1.6px solid var(--muted-2);transition:background .15s,border-color .15s}
.check::after{content:"";position:absolute;inset:-8px}
.check .ic{position:relative;width:13px;height:13px;stroke-width:2.8}
.check:hover::before{border-color:var(--accent)}
.check.on{color:var(--accent-ink)}
.check.on::before{background:var(--accent);border-color:var(--accent)}
.check.big{width:34px;height:34px;margin:0}
.check.big .ic{width:16px;height:16px}
.list.is-collapsed{flex-basis:52px;width:52px}
.list.is-collapsed .cards{display:none}
.collapsed-body{display:flex;flex-direction:column;align-items:center;gap:12px;width:100%;padding:16px 0 18px;border:0;border-radius:var(--r-col);background:none;color:var(--ink);cursor:pointer;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.collapsed-body:hover{background:var(--hover)}
.collapsed-body .ic{color:var(--muted)}
.v-title{writing-mode:vertical-rl;font:650 17px/1 var(--font-display);letter-spacing:-.01em;white-space:nowrap;max-height:56vh;overflow:hidden;text-overflow:ellipsis}
.list.is-collapsed.is-drop{background:var(--accent-soft);box-shadow:inset 0 0 0 2px var(--accent)}
.list-foot{flex:none;display:flex;align-items:center;justify-content:space-between;gap:6px;padding:2px 6px 8px}
.add-card{display:inline-flex;align-items:center;gap:6px;height:40px;padding:0 12px 0 8px;border:0;border-radius:9px;background:none;color:var(--muted);font:500 14.5px/1 var(--font-ui);cursor:pointer}
.add-card:hover{background:var(--hover);color:var(--ink)}
.composer{flex:none;display:flex;flex-direction:column;gap:8px;padding:4px 8px 8px}
.composer textarea,.add-list input{width:100%;resize:none;border:0;outline:none;border-radius:var(--r-card);background:var(--card);box-shadow:var(--shadow-card),0 0 0 2px var(--accent);padding:10px 12px;color:var(--ink);font:16px/1.35 var(--font-ui)}
.composer textarea{min-height:66px}
.composer-row{display:flex;align-items:center;gap:6px}
.composer-row .sheet-hint{margin:0 0 0 auto;font-size:12px}
.add-list{flex:0 0 var(--col-w);width:var(--col-w);display:flex;align-items:center;gap:6px;height:54px;padding:0 14px;border:1.5px dashed var(--line-strong);border-radius:var(--r-col);background:none;color:var(--muted);font:600 15px/1 var(--font-ui);cursor:pointer;scroll-snap-align:start}
.add-list:hover{color:var(--ink);border-color:var(--muted-2)}
.add-list.is-open{height:auto;flex-direction:column;align-items:stretch;gap:8px;padding:8px;border:0;background:var(--col);cursor:default}

/* drag states */
.is-placeholder{background:transparent!important;box-shadow:none!important;outline:1.5px dashed var(--line-strong);outline-offset:-1.5px;transform:none!important}
.is-placeholder>*{visibility:hidden}
.ghost{position:fixed!important;left:0;top:0;margin:0!important;z-index:60;pointer-events:none;opacity:.97;will-change:transform;overflow:hidden;box-shadow:var(--shadow-lift)!important;transition:none}
.tab.ghost{background:var(--card);border-radius:10px}
.ghost.settling{transition:transform .16s cubic-bezier(.2,.8,.2,1)}

/* ---------- buttons & fields ---------- */
.icon-btn{flex:none;width:40px;height:40px;display:grid;place-items:center;padding:0;border:0;border-radius:10px;background:none;color:var(--muted);cursor:pointer}
.icon-btn:hover{background:var(--hover);color:var(--ink)}
.icon-btn[disabled]{opacity:.35;cursor:default;background:none}
.icon-btn.sm{width:34px;height:34px}
.icon-btn.sm .ic{width:17px;height:17px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 16px;border:0;border-radius:11px;background:var(--hover);color:var(--ink);font:600 15px/1 var(--font-ui);cursor:pointer;white-space:nowrap;text-decoration:none}
.btn:hover{filter:brightness(.97)}
.btn[disabled]{opacity:.45;cursor:default;filter:none}
.btn.sm{height:36px;padding:0 12px;font-size:14px}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.danger{background:none;color:var(--danger);padding:0 8px}
.btn.danger:hover{background:color-mix(in srgb,var(--danger) 10%,transparent)}
.btn.danger-fill{background:var(--danger);color:#fff}
.btn .ic{width:18px;height:18px}
.btn.sm .ic{width:16px;height:16px}
.field{width:100%;border:1.5px solid var(--line);border-radius:10px;background:var(--field);color:var(--ink);padding:10px 12px;font:16px/1.4 var(--font-ui);outline:none;min-height:46px}
.field:focus{border-color:var(--accent)}
.field.area{resize:vertical;min-height:96px;display:block}
.field.sm{padding:7px 10px;min-height:0}
.mono{font:500 12px/1.2 var(--font-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.switch{flex:none;position:relative;width:24px;height:24px;border-radius:50%;border:1.6px solid var(--muted-2);transition:background .15s,border-color .15s}
.switch::after{content:"";position:absolute;left:7px;top:3.5px;width:5px;height:10px;border:solid var(--accent-ink);border-width:0 2.4px 2.4px 0;transform:rotate(45deg);opacity:0;transition:opacity .15s}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:50px;position:relative;cursor:pointer}
.toggle>span:first-child{display:flex;flex-direction:column;gap:2px;font-weight:500}
.toggle small{font-size:12.5px;font-weight:400;color:var(--muted)}
.toggle input{position:absolute;opacity:0;pointer-events:none}
.toggle input:checked+.switch{background:var(--accent);border-color:var(--accent)}
.toggle input:checked+.switch::after{opacity:1}
.toggle input:focus-visible+.switch{outline:2px solid var(--accent);outline-offset:2px}
.form-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.full{grid-column:1/-1}
.fld label,.fld .lbl{display:block;margin-bottom:6px;font:600 11px/1.2 var(--font-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.select-wrap{position:relative;display:inline-block;min-width:0;max-width:100%}
.select-wrap.block{display:block}
.select-wrap::after{content:"";position:absolute;right:13px;top:50%;width:7px;height:7px;border-right:1.6px solid var(--muted);border-bottom:1.6px solid var(--muted);transform:translateY(-70%) rotate(45deg);pointer-events:none}
.select{appearance:none;-webkit-appearance:none;max-width:100%;border:0;border-radius:9px;background:var(--hover);color:var(--ink);padding:9px 34px 9px 12px;font:500 16px/1.2 var(--font-ui);cursor:pointer;text-overflow:ellipsis}
.select-wrap.block .select{width:100%;min-height:46px}
.spinner{display:inline-block;width:18px;height:18px;border-radius:50%;border:2px solid var(--line-strong);border-top-color:var(--accent);animation:spin .8s linear infinite;vertical-align:-4px;margin-right:10px}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- sheets, menus, toast ---------- */
.scrim{position:fixed;inset:0;z-index:40;background:var(--scrim);opacity:0;transition:opacity .25s}
.scrim.in{opacity:1}
.scrim.clear{background:transparent}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;display:flex;flex-direction:column;max-height:calc(100% - 28px - env(safe-area-inset-top,0px));background:var(--sheet);color:var(--ink);border-radius:20px 20px 0 0;box-shadow:0 -12px 40px -12px rgba(0,0,0,.35);transform:translateY(104%);transition:transform .3s cubic-bezier(.2,.85,.25,1)}
.sheet.in{transform:none}
.sheet.tall{height:calc(100% - 28px - env(safe-area-inset-top,0px))}
.sheet-grip{flex:none;height:28px;display:grid;place-items:center;touch-action:none;cursor:grab}
.sheet-grip::before{content:"";width:40px;height:5px;border-radius:3px;background:var(--line-strong)}
.sheet-inner{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:0 18px calc(20px + env(safe-area-inset-bottom,0px))}
.sheet-title{margin:2px 0 14px;font:650 20px/1.25 var(--font-display);letter-spacing:-.015em;text-wrap:balance}
.sheet-text{margin:0 0 6px;color:var(--ink-2);line-height:1.5;max-width:62ch}
.sheet-hint{margin:10px 0 0;font-size:13px;line-height:1.45;color:var(--muted)}
.sheet-hint.err{color:var(--danger)}
.sheet-actions{display:flex;flex-wrap:wrap;justify-content:flex-end;align-items:center;gap:10px;margin-top:18px}
.steps-ol{margin:8px 0 16px;padding-left:22px;line-height:1.55;color:var(--ink-2)}
.steps-ol li{margin:4px 0}
@media (min-width:900px) and (hover:hover) and (pointer:fine){
  .sheet{left:50%;right:auto;bottom:auto;top:7vh;width:min(600px,calc(100vw - 48px));max-height:86vh;border-radius:18px;opacity:0;transform:translate(-50%,14px);transition:transform .22s cubic-bezier(.2,.85,.25,1),opacity .18s}
  .sheet.in{opacity:1;transform:translate(-50%,0)}
  .sheet.compact{width:min(460px,calc(100vw - 48px));top:12vh}
  .sheet.tall{height:86vh}
  .sheet.wide{width:min(880px,calc(100vw - 48px))}
  .sheet.viewer{width:min(1100px,calc(100vw - 48px));top:5vh;height:90vh;max-height:90vh}
  .sheet-grip{height:16px;cursor:default}
  .sheet-grip::before{display:none}
  .sheet-inner{padding:4px 24px 24px}
}
.menu{position:fixed;z-index:51;background:var(--sheet);color:var(--ink)}
.menu.as-sheet{left:8px;right:8px;bottom:calc(8px + env(safe-area-inset-bottom,0px));max-height:80%;overflow-y:auto;padding:6px;border-radius:18px;box-shadow:var(--shadow-lift);transform:translateY(calc(100% + 24px));transition:transform .26s cubic-bezier(.2,.85,.25,1)}
.menu.as-sheet.in{transform:none}
.menu.pop{min-width:250px;max-width:320px;max-height:80vh;overflow-y:auto;padding:5px;border-radius:12px;box-shadow:var(--shadow-lift);opacity:0;transform:translateY(-4px);transition:opacity .14s,transform .14s}
.menu.pop.in{opacity:1;transform:none}
.menu-item{display:flex;align-items:center;gap:12px;width:100%;min-height:50px;padding:0 12px;border:0;border-radius:10px;background:none;color:var(--ink);font:500 16px/1.25 var(--font-ui);text-align:left;cursor:pointer}
.menu.pop .menu-item{min-height:40px;font-size:14.5px}
.menu-item:hover,.menu-item:focus-visible{background:var(--hover);outline:none}
.menu-item[disabled]{opacity:.42;cursor:default}
.menu-item .ic{color:var(--muted)}
.menu-item.danger{color:var(--danger)}
.menu-item.danger .ic{color:currentColor}
.mi-label{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.mi-label small{font-size:12.5px;font-weight:400;color:var(--muted)}
.mi-check{display:grid;color:transparent}
.mi-check.on{color:var(--accent)}
.menu-item .mi-check .ic{color:inherit}
.menu-title{padding:10px 12px 6px;font:600 11.5px/1.2 var(--font-mono);letter-spacing:.07em;text-transform:uppercase;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.menu-sep{height:1px;margin:5px 10px;background:var(--line)}
.menu-swatches{display:flex;flex-wrap:wrap;gap:12px;padding:8px 12px 12px}
.swatch{width:30px;height:30px;padding:0;border:0;border-radius:50%;background:var(--c);cursor:pointer}
.swatch.on{box-shadow:0 0 0 2px var(--sheet),0 0 0 4px var(--c)}
.toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:70;display:flex;align-items:center;gap:12px;max-width:calc(100vw - 32px);padding:8px 8px 8px 16px;border-radius:12px;background:var(--ink);color:var(--ground);font:500 14.5px/1.3 var(--font-ui);box-shadow:var(--shadow-lift);opacity:0;transform:translate(-50%,16px);transition:opacity .2s,transform .2s;pointer-events:none}
.toast.in{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast span{padding:6px 0}
.toast .spinner{border-color:color-mix(in srgb,var(--ground) 30%,transparent);border-top-color:var(--ground);margin:0}
.toast-btn{flex:none;border:0;background:none;padding:8px 10px;border-radius:8px;color:var(--toast-accent);font:700 14.5px/1 var(--font-ui);cursor:pointer}
@media (min-width:900px) and (hover:hover) and (pointer:fine){.toast{bottom:24px}}

/* ---------- detail sheets (card, step) ---------- */
.cs-head{display:flex;align-items:flex-start;gap:8px;padding:0 0 6px}
.cs-title{flex:1;min-width:0;resize:none;overflow:hidden;border:0;outline:none;background:none;padding:4px 2px;border-radius:8px;color:var(--ink);font:650 21px/1.25 var(--font-display);letter-spacing:-.015em}
.cs-title:focus{background:var(--hover)}
.cs-where{display:flex;align-items:center;gap:8px;padding:0 0 14px 42px;min-width:0}
.cs-sec{padding:14px 0 16px;border-top:1px solid var(--line)}
.cs-sec-head{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:28px;margin-bottom:8px}
.cs-sec h3{margin:0;font:600 11.5px/1 var(--font-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.cs-foot{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:12px;border-top:1px solid var(--line)}
.label-pick{display:flex;flex-wrap:wrap;gap:8px}
.lp{display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 13px 0 11px;border:1.5px solid var(--line);border-radius:999px;background:none;color:var(--ink-2);font:500 14px/1 var(--font-ui);cursor:pointer}
.lp i{width:14px;height:14px;border-radius:50%;background:var(--c)}
.lp.on{border-color:var(--c);background:color-mix(in srgb,var(--c) 15%,transparent);color:var(--ink)}
.lp.add{border-style:dashed;color:var(--muted)}
.lp.add .ic{width:16px;height:16px}
.progress{height:4px;margin:0 0 6px;border-radius:2px;background:var(--hover);overflow:hidden}
.progress i{display:block;height:100%;border-radius:2px;background:var(--good);transition:width .25s}
.cl{list-style:none;margin:0 0 8px;padding:0}
.cl li{display:flex;align-items:center;gap:4px;min-height:44px}
.cl-check{flex:none;position:relative;width:36px;height:36px;margin-left:-6px;padding:0;display:grid;place-items:center;border:0;background:none;color:transparent;cursor:pointer}
.cl-check::before{content:"";position:absolute;width:20px;height:20px;border-radius:6px;border:1.6px solid var(--muted-2)}
.cl-check .ic{position:relative;width:13px;height:13px;stroke-width:2.8}
.cl-check.on{color:#fff}
.cl-check.on::before{background:var(--good);border-color:var(--good)}
.cl-text{flex:1;min-width:0;border:0;outline:none;background:none;padding:8px 6px;border-radius:7px;color:var(--ink);font:16px/1.3 var(--font-ui)}
.cl-text:focus{background:var(--hover)}
.cl li.on .cl-text{color:var(--muted);text-decoration:line-through}
.att-list{display:flex;flex-direction:column;gap:6px;margin-bottom:10px}
.att{display:flex;align-items:center;gap:4px;padding:4px;border-radius:12px;background:var(--field)}
.att-open{flex:1;min-width:0;display:flex;align-items:center;gap:10px;padding:2px 4px;border:0;background:none;color:var(--ink);text-align:left;cursor:pointer;border-radius:9px}
.att.missing .fname b{color:var(--muted);text-decoration:line-through}
.att-actions{display:flex;flex-wrap:wrap;gap:8px}
.link-box{display:flex;align-items:center;gap:10px;padding:8px 8px 8px 12px;border-radius:12px;background:var(--field)}
.link-box .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.link-box b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.link-box small{font:500 12px/1.2 var(--font-mono);color:var(--muted)}
.row-btns{display:flex;flex-wrap:wrap;gap:8px}
.st-seg{margin:0 0 14px}
.st-seg button.on[data-v="doing"]{color:var(--accent)}
.st-seg button.on[data-v="done"]{color:var(--good)}
@media (min-width:900px) and (hover:hover) and (pointer:fine){
  .cs-grid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:0 28px}
}

/* ---------- blocks ---------- */
.blocks-wrap{max-width:1180px;margin:0 auto;padding:4px 14px 32px}
.banner{display:flex;align-items:center;gap:12px;margin:2px 0 14px;padding:12px 12px 12px 16px;border-radius:14px;background:var(--accent-soft);color:var(--ink-2);line-height:1.4}
.banner p{flex:1;margin:0;font-size:14px}
.overview{padding:16px 18px 16px;margin-bottom:16px;border-radius:16px;background:var(--col)}
.ov-top{display:flex;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:8px 16px;margin-bottom:14px}
.ov-pct{font:700 46px/.9 var(--font-display);letter-spacing:-.035em;font-variant-numeric:tabular-nums}
.ov-pct span{font-size:24px;letter-spacing:0;color:var(--muted);margin-left:2px}
.ov-sub{margin-top:8px;color:var(--muted);font-size:13.5px}
.ov-side{display:flex;gap:18px;text-align:right}
.ov-side b{display:block;font:650 20px/1 var(--font-display);font-variant-numeric:tabular-nums}
.ov-side small{display:block;margin-top:5px;font:600 10.5px/1 var(--font-mono);letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.ov-bar{display:flex;gap:3px;height:12px}
.ov-bar>span{position:relative;min-width:8px;border-radius:4px;background:color-mix(in srgb,var(--c) 20%,transparent);overflow:hidden}
.ov-bar>span>i{position:absolute;left:0;top:0;bottom:0;background:var(--c)}
.sec-label{display:flex;align-items:center;gap:8px;margin:20px 2px 10px;font:600 11.5px/1 var(--font-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.sec-label .ic{width:15px;height:15px}
.now-list{display:grid;grid-template-columns:1fr;gap:6px}
@media (min-width:760px){.now-list{grid-template-columns:repeat(2,minmax(0,1fr))}}
.blocks{position:relative;display:grid;grid-template-columns:minmax(0,1fr);gap:12px;align-items:start;margin-top:4px}
@media (min-width:760px){.blocks{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (min-width:1500px){.blocks-wrap{max-width:1560px}.blocks{grid-template-columns:repeat(3,minmax(0,1fr))}}
.block{position:relative;background:var(--col);border-radius:var(--r-col);padding-bottom:6px}
.block-head{display:flex;align-items:center;gap:2px;padding:8px 4px 4px 4px;cursor:grab;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.block-head.is-pressing{background:var(--hover);border-radius:12px}
.block-tog{flex:none;width:34px;height:34px;display:grid;place-items:center;padding:0;border:0;border-radius:9px;background:none;color:var(--muted);cursor:pointer}
.block-tog:hover{background:var(--hover);color:var(--ink)}
.block-tog .ic{width:17px;height:17px;transition:transform .18s}
.block.is-collapsed .block-tog .ic{transform:rotate(-90deg)}
.block-name{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px;padding:5px 6px;border:0;border-radius:9px;background:none;color:var(--ink);text-align:left;cursor:pointer}
.block-name:hover{background:var(--hover)}
.block-name b{display:flex;align-items:center;gap:8px;font:650 17px/1.2 var(--font-display);letter-spacing:-.015em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.block-name b i{flex:none;width:9px;height:9px;border-radius:3px;background:var(--c)}
.block-name small{font:500 12px/1 var(--font-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.done-badge{flex:none;width:24px;height:24px;display:grid;place-items:center;border-radius:50%;background:var(--good);color:#fff}
.done-badge .ic{width:14px;height:14px;stroke-width:2.8}
.block-bar{height:5px;margin:2px 14px 8px;border-radius:3px;background:color-mix(in srgb,var(--c) 18%,transparent);overflow:hidden}
.block-bar i{display:block;height:100%;border-radius:3px;background:var(--c);transition:width .3s}
.block-desc{margin:-2px 14px 10px;color:var(--muted);font-size:13.5px;line-height:1.45;white-space:pre-wrap}
.steps{display:flex;flex-direction:column;gap:5px;min-height:6px;padding:0 8px 2px}
.block.is-collapsed .steps,.block.is-collapsed .block-foot,.block.is-collapsed .block-desc,.block.is-collapsed .composer{display:none}
.block.is-collapsed.is-drop{box-shadow:inset 0 0 0 2px var(--accent)}
.block-foot{padding:2px 6px 2px}
.step{position:relative;display:flex;align-items:center;gap:8px;min-height:48px;padding:6px 10px 6px 5px;background:var(--card);border-radius:10px;box-shadow:var(--shadow-card);cursor:grab;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;transition:transform .16s ease,box-shadow .16s ease}
@media (hover:hover){.step:hover{box-shadow:var(--shadow-hover)}}
.step:focus-visible{outline:none;box-shadow:var(--shadow-card),0 0 0 2px var(--accent)}
.st{flex:none;position:relative;width:34px;height:34px;padding:0;display:grid;place-items:center;border:0;background:none;border-radius:50%;color:transparent;cursor:pointer}
.st::before{content:"";position:absolute;inset:7px;border-radius:50%;border:1.7px solid var(--muted-2);transition:background .15s,border-color .15s,box-shadow .15s}
.st::after{content:"";position:absolute;inset:-4px}
.st .ic{position:relative;width:12px;height:12px;stroke-width:3}
.st:hover::before{border-color:var(--accent)}
.st-doing .st::before{border-color:var(--accent);background:var(--accent);box-shadow:inset 0 0 0 3.5px var(--card)}
.st-done .st{color:#fff}
.st-done .st::before{border-color:var(--good);background:var(--good)}
.st-doing{box-shadow:var(--shadow-card),inset 3px 0 0 var(--accent)}
.step-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.step-title{font-size:15px;line-height:1.35;overflow-wrap:anywhere}
.st-done .step-title{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--muted-2)}
.step-block{display:flex;align-items:center;gap:6px;font:500 12px/1.2 var(--font-mono);color:var(--muted)}
.step-block i{width:7px;height:7px;border-radius:2px;background:var(--c)}
.step-meta{flex:none;display:flex;align-items:center;gap:10px}
.doing-tag{font:600 10.5px/1 var(--font-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.add-block{display:flex;align-items:center;justify-content:center;gap:8px;min-height:64px;border:1.5px dashed var(--line-strong);border-radius:var(--r-col);background:none;color:var(--muted);font:600 15px/1 var(--font-ui);cursor:pointer}
.add-block:hover{color:var(--ink);border-color:var(--muted-2)}

/* ---------- files ---------- */
.files-wrap{max-width:1000px;margin:0 auto;padding:0 14px 32px}
.files-bar{position:sticky;top:0;z-index:3;display:flex;align-items:center;gap:4px;padding:6px 0 10px;background:var(--ground)}
.crumbs{flex:1;min-width:0;display:flex;align-items:center;gap:0;overflow-x:auto;scrollbar-width:none}
.crumbs::-webkit-scrollbar{display:none}
.crumb{flex:none;display:inline-flex;align-items:center;gap:6px;height:36px;border:0;background:none;padding:0 8px;border-radius:8px;color:var(--muted);font:600 15px/1 var(--font-ui);cursor:pointer;white-space:nowrap}
.crumb:hover{background:var(--hover);color:var(--ink)}
.crumb:last-of-type{color:var(--ink)}
.crumb .ic{width:17px;height:17px}
.crumb-sep{flex:none;color:var(--muted-2)}
.crumb-sep .ic{width:14px;height:14px}
.fsearch{position:relative;margin:0 0 10px}
.fsearch .ic{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);width:18px;height:18px}
.fsearch .field{padding-left:40px}
.flist{list-style:none;margin:0;padding:4px;border-radius:14px;background:var(--col)}
.frow{display:flex;align-items:center;gap:4px;border-radius:10px}
.frow+.frow{box-shadow:0 -1px 0 var(--line)}
.frow:hover{background:var(--hover)}
.frow.sel{background:var(--accent-soft)}
.f-open{flex:1;min-width:0;display:flex;align-items:center;gap:12px;min-height:56px;padding:6px 6px 6px 8px;border:0;background:none;color:var(--ink);text-align:left;cursor:pointer;border-radius:10px}
.ficon{flex:none;width:38px;height:38px;display:grid;place-items:center;border-radius:9px;background:var(--card);box-shadow:var(--shadow-card);color:var(--muted);overflow:hidden}
.ficon.sm{width:34px;height:34px}
.ficon img{width:100%;height:100%;object-fit:cover}
.ficon.dir{background:var(--accent-soft);box-shadow:none;color:var(--accent)}
.ficon.k-image{color:var(--l-teal)} .ficon.k-stl,.ficon.k-cad{color:var(--l-orchid)} .ficon.k-md{color:var(--l-ultra)} .ficon.k-text{color:var(--l-mustard)} .ficon.k-pdf{color:var(--l-rust)}
.fname{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.fname b{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fname small{font:500 12px/1.2 var(--font-mono);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fsel{flex:none;margin-left:4px}
.flist.drop-over{box-shadow:inset 0 0 0 2px var(--accent);background:var(--accent-soft)}
.files-empty{padding:28px 12px;text-align:center;color:var(--muted);line-height:1.5}
.sel-bar{position:sticky;bottom:10px;z-index:4;display:flex;align-items:center;gap:6px;margin-top:12px;padding:6px 6px 6px 14px;border-radius:14px;background:var(--sheet);box-shadow:var(--shadow-lift)}
.sel-bar b{flex:1;font-weight:600}
.readme{margin-top:16px;padding:20px 22px;border-radius:14px;background:var(--card);box-shadow:var(--shadow-card)}
.readme-head{display:flex;align-items:center;gap:8px;margin:-6px 0 10px;font:600 11.5px/1 var(--font-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.readme-head .ic{width:15px;height:15px}
.readme-head span{text-transform:none;letter-spacing:0;font-size:12.5px}
.center-panel{max-width:420px;margin:10vh auto 0;padding:0 24px;text-align:center}
.center-panel .cp-icon{width:64px;height:64px;margin:0 auto 18px;display:grid;place-items:center;border-radius:18px;background:var(--accent-soft);color:var(--accent)}
.center-panel .cp-icon .ic{width:30px;height:30px}
.center-panel h2{margin:0 0 8px;font:650 22px/1.2 var(--font-display);letter-spacing:-.015em}
.center-panel p{margin:0 0 20px;color:var(--muted);line-height:1.5}
.hist-row{display:flex;align-items:center;gap:12px;min-height:58px;padding:8px 4px;border-bottom:1px solid var(--line);color:var(--ink);text-decoration:none}
.hist-row:hover{background:var(--hover)}
.hist-row .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.hist-row b{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hist-row small{font:500 12px/1.2 var(--font-mono);color:var(--muted)}
.pick-list{display:flex;flex-direction:column;margin-top:10px}
.pick-row{display:flex;align-items:center;gap:12px;min-height:52px;padding:6px 6px;border:0;border-bottom:1px solid var(--line);background:none;color:var(--ink);text-align:left;cursor:pointer;width:100%}
.pick-row:hover{background:var(--hover)}
.pick-head{margin:16px 0 4px;display:flex;align-items:center;gap:8px;font:600 11.5px/1 var(--font-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.pick-head i{width:8px;height:8px;border-radius:2px;background:var(--c)}

/* ---------- viewer ---------- */
.vw-head{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:6px;padding:0 0 12px;background:var(--sheet)}
.vw-title{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px;margin-left:4px}
.vw-title b{font:650 17px/1.2 var(--font-display);letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vw-title small{font:500 12px/1.2 var(--font-mono);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vw-body{min-height:200px}
.vw-img{display:block;max-width:100%;max-height:72vh;margin:0 auto;border-radius:10px;background:repeating-conic-gradient(var(--hover) 0 25%,transparent 0 50%) 0 0/20px 20px}
pre.code{margin:0;padding:14px 16px;border-radius:12px;background:var(--field);font:12.5px/1.6 var(--font-mono);overflow:auto;white-space:pre;tab-size:2;color:var(--ink-2)}
.editor{display:block;width:100%;min-height:58vh;resize:vertical;border:1.5px solid var(--line);border-radius:12px;background:var(--field);color:var(--ink);padding:14px 16px;font:16px/1.55 var(--font-mono);outline:none;tab-size:2;white-space:pre;overflow-wrap:normal;overflow:auto}
.editor:focus{border-color:var(--accent)}
@media (min-width:900px) and (hover:hover) and (pointer:fine){.editor{font-size:13px}}
.vw-msg{margin-top:10px}
.vw-pdf{display:block;width:100%;height:68vh;border:0;border-radius:12px;background:#fff}
.vw-media{display:block;width:100%;max-height:70vh;border-radius:12px}
.stl-box{position:relative;height:min(64vh,620px);border-radius:14px;overflow:hidden;touch-action:none;background:radial-gradient(120% 90% at 50% 20%,var(--col),var(--ground))}
.stl-box canvas{display:block;width:100%;height:100%}
.stl-info{position:absolute;left:12px;bottom:12px;display:flex;flex-wrap:wrap;gap:6px;pointer-events:none}
.stl-info span{padding:6px 9px;border-radius:8px;background:color-mix(in srgb,var(--sheet) 88%,transparent);font:500 12px/1 var(--font-mono);color:var(--ink-2);box-shadow:var(--shadow-card)}
.stl-hint{position:absolute;right:12px;top:12px;font:500 11.5px/1 var(--font-mono);color:var(--muted);pointer-events:none}
.empty{padding:36px 12px;text-align:center;color:var(--muted);line-height:1.55}
.md-body{line-height:1.6;color:var(--ink);overflow-wrap:anywhere}
.md-body>:first-child{margin-top:0}
.md-body h1,.md-body h2,.md-body h3,.md-body h4{font-family:var(--font-display);letter-spacing:-.015em;line-height:1.25;margin:1.4em 0 .5em}
.md-body h1{font-size:26px} .md-body h2{font-size:21px;padding-bottom:6px;border-bottom:1px solid var(--line)} .md-body h3{font-size:17px}
.md-body p,.md-body ul,.md-body ol,.md-body table,.md-body blockquote,.md-body pre{margin:0 0 1em}
.md-body ul,.md-body ol{padding-left:1.5em}
.md-body li{margin:.2em 0}
.md-body li:has(>input[type=checkbox]){list-style:none;margin-left:-1.3em}
.md-body code{padding:2px 5px;border-radius:5px;background:var(--field);font:.88em var(--font-mono)}
.md-body pre{padding:12px 14px;border-radius:10px;background:var(--field);overflow:auto}
.md-body pre code{padding:0;background:none}
.md-body img{max-width:100%;border-radius:8px}
.md-body blockquote{padding:4px 14px;border-left:3px solid var(--accent);background:var(--accent-soft);border-radius:0 8px 8px 0;color:var(--ink-2)}
.md-body table{border-collapse:collapse;display:block;overflow-x:auto;max-width:100%}
.md-body th,.md-body td{padding:7px 11px;border:1px solid var(--line);text-align:left;vertical-align:top}
.md-body th{background:var(--field);font-weight:600}
.md-body hr{border:0;border-top:1px solid var(--line);margin:1.6em 0}
.set-sec{padding:14px 0 16px;border-top:1px solid var(--line)}
.set-sec:first-of-type{border-top:0;padding-top:0}
.set-sec h3{margin:0 0 10px;font:600 11.5px/1 var(--font-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.tag-row{display:flex;align-items:center;gap:8px;min-height:46px;border-bottom:1px solid var(--line)}
.tag-row .swatch{width:22px;height:22px;flex:none}
.tag-row input{flex:1;min-width:0;border:0;background:none;outline:none;padding:8px 4px;border-radius:7px;font:16px/1.3 var(--font-ui);color:var(--ink)}
.tag-row input:focus{background:var(--hover)}
.log-imgs{display:flex;flex-wrap:wrap;gap:8px}
.log-img{position:relative;width:76px;height:76px;border-radius:10px;overflow:hidden;background:var(--field);cursor:pointer}
.log-img img{width:100%;height:100%;object-fit:cover}
.log-img input{position:absolute;right:5px;top:5px;width:18px;height:18px;accent-color:var(--accent)}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{transition:none!important;animation:none!important}}
</style>

function doneListOf(board, create) {

function setCardDone(id, done, fromStep = false) {
  const f = findCard(id); if (!f) return;

      const dl = doneListOf(f.board, true);

const layer = $('#layer');
const stack = [];

let skipPop = 0, hasEntry = false, backTimer = 0;

}

}
function closeEntry(entry, fromPop) {

const closeTop = fromPop => { if (stack.length) closeEntry(stack[stack.length - 1], fromPop); };
const closeAll = () => { if (stack.length) closeEntry(stack[0]); };

function openSheet(build, {cls = '', onClose} = {}) {

    : status === 403 ? 'The token can’t do this. Give it “Contents: Read and write” for this repository.'

/* ================= markdown ================= */
async function renderMarkdown(text, baseDir, el) {
  await Promise.all([loadScript(LIBS.marked), loadScript(LIBS.purify)]);
  el.innerHTML = DOMPurify.sanitize(marked.parse(text, {gfm: true}));
  for (const img of $$('img', el)) {
    const src = img.getAttribute('src') || '';
    if (!src || /^(https?:|data:|blob:)/i.test(src)) continue;
    let p; try { p = resolvePath(baseDir, decodeURIComponent(src.split(/[?#]/)[0])); } catch (e) { continue; }
    const it = T.items.get(p);
    img.removeAttribute('src');
    if (it) readBlob(it.sha).then(b => { img.src = URL.createObjectURL(new Blob([b], {type: mimeOf(p)})); }).catch(() => {});
    else img.alt = (img.alt || 'Image') + ' (not found)';
  }
  for (const a of $$('a', el)) {
    const href = a.getAttribute('href') || '';
    if (!href || href.startsWith('#')) continue;
    if (/^[a-z][a-z0-9+.-]*:/i.test(href)) { a.target = '_blank'; a.rel = 'noopener'; continue; }
    let p; try { p = resolvePath(baseDir, decodeURIComponent(href.split(/[?#]/)[0])); } catch (e) { continue; }
    if (T.items.has(p) || p === '') { a.dataset.open = p; a.href = '#'; }
  }
  for (const cb of $$('input[type=checkbox]', el)) cb.disabled = true;
}
function openRepoLink(p) {

/* ================= STL viewer (three.js) ================= */
function parseSTL(buf) {
  const dv = new DataView(buf);
  let binary = buf.byteLength >= 84 && 84 + dv.getUint32(80, true) * 50 === buf.byteLength;
  if (!binary) {
    const head = decodeUtf8(buf.slice(0, Math.min(1000, buf.byteLength)));
    binary = !/^\s*solid[\s\S]*facet/i.test(head) && buf.byteLength >= 84;
  }
  let pos;
  if (binary) {
    const n = Math.min(dv.getUint32(80, true), Math.floor((buf.byteLength - 84) / 50));
    pos = new Float32Array(n * 9);
    for (let i = 0; i < n; i++) { const o = 84 + i * 50 + 12; for (let j = 0; j < 9; j++) pos[i * 9 + j] = dv.getFloat32(o + j * 4, true); }
  } else {
    const text = decodeUtf8(buf), out = [];
    const re = /vertex\s+([-+\d.eE]+)\s+([-+\d.eE]+)\s+([-+\d.eE]+)/g; let m;
    while ((m = re.exec(text))) out.push(+m[1], +m[2], +m[3]);
    pos = new Float32Array(out);
  }
  return pos;
}
async function showSTL(box, buf) {
  await loadScript(LIBS.three); await loadScript(LIBS.orbit);
  const pos = parseSTL(buf);
  if (!pos.length) throw new Error('This STL file has no triangles.');
  const geom = new THREE.BufferGeometry();
  geom.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geom.computeVertexNormals(); geom.computeBoundingBox();
  const bb = geom.boundingBox, size = new THREE.Vector3(), center = new THREE.Vector3();
  bb.getSize(size); bb.getCenter(center);
  geom.translate(-center.x, -center.y, -center.z);
  const dark = getComputedStyle(document.documentElement).colorScheme === 'dark';
  const renderer = new THREE.WebGLRenderer({antialias: true, alpha: true});
  renderer.setPixelRatio(Math.min(2, devicePixelRatio || 1));
  box.prepend(renderer.domElement);
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(35, 1, 0.1, 1e6);
  const mesh = new THREE.Mesh(geom, new THREE.MeshStandardMaterial({color: dark ? 0xd9dde5 : 0xf2f4f7, roughness: .5, metalness: .05}));
  mesh.rotation.x = -Math.PI / 2;
  scene.add(mesh);
  const r = size.length() / 2 || 1;
  const grid = new THREE.GridHelper(r * 4, 20, dark ? 0x3d4350 : 0xbfc4ce, dark ? 0x2a2f39 : 0xdcdfe5);
  grid.position.y = -size.z / 2; scene.add(grid);
  scene.add(new THREE.HemisphereLight(0xffffff, dark ? 0x202530 : 0x8090a0, .75));
  const key = new THREE.DirectionalLight(0xffffff, .75); key.position.set(1, 1.4, 1.2); camera.add(key); scene.add(camera);
  const accent = new THREE.DirectionalLight(0x9cc0ff, .25); accent.position.set(-1.5, .4, -1); scene.add(accent);
  const controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true; controls.target.set(0, 0, 0);
  let raf = 0, alive = true, framed = false;
  const fit = () => {
    const w = box.clientWidth, h = box.clientHeight; if (!w || !h) return;
    renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix();
    if (!framed) {
      /* distance that fits the whole model in the narrower of the two view angles */
      framed = true;
      const v = THREE.MathUtils.degToRad(camera.fov), hz = 2 * Math.atan(Math.tan(v / 2) * camera.aspect);
      const dist = r / Math.sin(Math.min(v, hz) / 2) * 1.08;
      camera.position.copy(new THREE.Vector3(1.7, 1.15, 2.1).normalize().multiplyScalar(dist));
      controls.update();
    }
  };
  const ro = new ResizeObserver(fit); ro.observe(box); fit();
  const loop = () => { if (!alive) return; controls.update(); renderer.render(scene, camera); raf = requestAnimationFrame(loop); };
  loop();
  $('.stl-info', box).innerHTML = `<span>${size.x.toFixed(1)} × ${size.y.toFixed(1)} × ${size.z.toFixed(1)} mm</span><span>${(pos.length / 9).toLocaleString()} triangles</span>`;
  return () => { alive = false; cancelAnimationFrame(raf); ro.disconnect(); controls.dispose(); geom.dispose(); mesh.material.dispose(); renderer.dispose(); };
}

  let kind = isNew ? (kindOf(path) === 'md' ? 'md' : 'text') : kindOf(path);
  let mode = isNew ? 'edit' : 'view', text = isNew ? '' : null, buf = null, url = null, dispose = null, showSrc = false, loadErr = '', forced = false, saving = false;
  let baseSha = it ? it.sha : null;
  openSheet((inner, entry) => {
    const editable = () => (kind === 'md' || kind === 'text') && text != null && !text.startsWith('version https://git-lfs');
    const head = () => `<div class="vw-head"><span class="ficon sm k-${kind}">${ic(KIND_ICON[kind])}</span><div class="vw-title"><b>${esc(baseName(path))}</b><small>${esc(dirName(path) || '/')}${it ? ' · ' + fmtSize(it.size) : ' · new file'}</small></div>` +
      (mode === 'edit'
        ? `<button type="button" class="btn sm" data-x="cancel">Cancel</button><button type="button" class="btn sm primary" data-x="save"${saving ? ' disabled' : ''}>${saving ? 'Saving…' : 'Save'}</button>`
        : `${kind === 'md' && text != null ? `<button type="button" class="icon-btn" data-x="src" aria-label="${showSrc ? 'Show preview' : 'Show source'}" title="${showSrc ? 'Show preview' : 'Show source'}">${ic(showSrc ? 'eye' : 'code')}</button>` : ''}${editable() ? `<button type="button" class="icon-btn" data-x="edit" aria-label="Edit" title="Edit">${ic('edit')}</button>` : ''}<button type="button" class="icon-btn" data-x="download" aria-label="Download" title="Download">${ic('download')}</button><button type="button" class="icon-btn" data-x="more" aria-label="More">${ic('more')}</button>`) +
      `<button type="button" class="icon-btn" data-x="close" aria-label="Close">${ic('x')}</button></div>`;
    const objUrl = () => url || (url = URL.createObjectURL(new Blob([buf], {type: mimeOf(path)})));

      }

      else if (kind === 'md' && !showSrc) { const art = document.createElement('article'); art.className = 'md-body'; art.innerHTML = '<div class="empty"><i class="spinner"></i></div>'; b.appendChild(art); renderMarkdown(text, dirName(path), art).catch(e => { art.innerHTML = `<pre class="code">${esc(text)}</pre>`; }); }

        it = T.items.get(path); baseSha = it.sha; text = newText; buf = new TextEncoder().encode(newText).buffer; isNew = false; mode = 'view'; saving = false;

  if (doing.length) h += `<h3 class="sec-label">${ic('play')}Working on now</h3><div class="now-list">${doing.map(({b, s}) => stepHTML(s, b, true)).join('')}</div>`;

/* ----- board ----- */
function viewCards(l) {
  const a = l.cards.slice(), pin = c => c.pinned ? 0 : 1;
  if (l.sort === 'priority') a.sort((x, y) => pin(x) - pin(y) || y.priority - x.priority);
  else if (l.sort === 'due') a.sort((x, y) => pin(x) - pin(y) || (x.due || '9999').localeCompare(y.due || '9999'));
  else a.sort((x, y) => pin(x) - pin(y));
  return a;
}
function cardHTML(c) {
  const tags = c.tags.map(id => state.tags.find(t => t.id === id)).filter(Boolean);
  const meta = [];
  if (c.pinned) meta.push(`<span class="chip pin" title="Pinned">${ic('star')}</span>`);
  if (c.priority) meta.push(`<span class="chip" style="color:${col(PRIO_C[c.priority])}">${ic('flag')}${PRIO[c.priority]}</span>`);
  if (c.due) { const d = dueInfo(c.due); meta.push(`<span class="chip ${c.done ? '' : d.cls}">${ic('calendar')}${d.text}</span>`); }
  if (c.checklist.length) { const n = c.checklist.filter(i => i.done).length; meta.push(`<span class="chip${n === c.checklist.length ? ' ok' : ''}">${ic('checklist')}${n}/${c.checklist.length}</span>`); }
  if (c.files.length) meta.push(`<span class="chip">${ic('clip')}${c.files.length}</span>`);
  if (c.desc.trim()) meta.push(`<span class="chip" title="Has notes">${ic('note')}</span>`);
  const s = c.step && findStep(c.step);
  if (s) meta.push(`<span class="chip blk" style="--c:${col(s.block.color)}">${ic('layers')}${esc(s.block.title)}</span>`);
  return `<div class="card${c.done ? ' is-done' : ''}" data-card="${c.id}" tabindex="0">${tags.length ? `<div class="card-labels">${tags.map(t => `<span class="lab" style="--c:${col(t.color)}">${esc(t.name)}</span>`).join('')}</div>` : ''}<div class="card-main"><button type="button" class="check${c.done ? ' on' : ''}" data-act="card-check" aria-label="${c.done ? 'Mark not done' : 'Mark done'}: ${esc(c.title)}">${ic('check')}</button><div class="card-title">${esc(c.title)}</div></div>${meta.length ? `<div class="card-meta">${meta.join('')}</div>` : ''}</div>`;
}
function listHTML(l) {
  if (l.collapsed) return `<section class="list is-collapsed" data-list="${l.id}"><button type="button" class="collapsed-body" data-act="list-expand" data-drag="list" aria-label="Expand ${esc(l.title)}">${ic('chev-r')}<span class="v-title">${esc(l.title)}</span><span class="list-count">${l.cards.length}</span></button><div class="cards" data-cards></div></section>`;
  const comp = composing && composing.kind === 'card' && composing.list === l.id;
  return `<section class="list" data-list="${l.id}"><div class="list-head" data-drag="list">${l.isDone ? `<span class="list-done-ic" title="Done column">${ic('check')}</span>` : ''}<button type="button" class="list-title" data-act="list-rename">${esc(l.title)}</button><span class="list-count">${l.cards.length}</span><button type="button" class="icon-btn sm" data-act="list-menu" aria-label="List options">${ic('more')}</button></div>

    ${comp ? composerHTML('Name the card…') : `<div class="list-foot"><button type="button" class="add-card" data-act="card-add">${ic('plus')}Add a card</button></div>`}</section>`;
}
function renderBoard() {
  const b = curBoard();
  ui.board = b.id;
  tabsEl.innerHTML = state.boards.map(x => `<button type="button" role="tab" class="tab${x === b ? ' is-active' : ''}" data-board="${x.id}" aria-selected="${x === b}"><span class="tab-dot" style="--c:${col(x.color)}"></span>${esc(x.name)}<span class="tab-count">${x.lists.filter(l => !l.isDone).reduce((n, l) => n + l.cards.filter(c => !c.done).length, 0)}</span></button>`).join('') +
    `<button type="button" class="tab-add" data-act="board-add" aria-label="New board">${ic('plus')}</button>`;

    ? `<div class="add-list is-open"><input placeholder="List name" value="${esc(composing.text || '')}" aria-label="List name" enterkeyhint="done"><div class="composer-row"><button type="button" class="btn primary sm" data-act="composer-add">Add list</button><button type="button" class="icon-btn sm" data-act="composer-close" aria-label="Cancel">${ic('x')}</button></div></div>`

function renderFileList() {
  const box = $('#f-list'); if (!box) return;

  if (q) rows = [...T.items.values()].filter(it => !isKeep(it.path) && baseName(it.path).toLowerCase().includes(q)).slice(0, 300);
  else rows = (T.kids.get(dir) || []).map(p => T.items.get(p)).filter(it => it && !isKeep(it.path));

    (fileSel ? `<div class="sel-bar"><b>${fileSel.size} selected</b><button type="button" class="btn sm" data-act="sel-move"${fileSel.size ? '' : ' disabled'}>${ic('move')}Move</button><button type="button" class="btn sm" data-act="sel-delete"${fileSel.size ? '' : ' disabled'}>${ic('trash')}Delete</button><button type="button" class="icon-btn sm" data-act="sel-cancel" aria-label="Stop selecting">${ic('x')}</button></div>` : '') +

  observeThumbs(box);

    readBlob(it.sha).then(b => renderMarkdown(decodeUtf8(b), dir, el)).catch(e => { el.textContent = e.message; });
  }
}

    <div class="att-actions"><button type="button" class="btn sm" data-x="file-upload">${ic('upload')}Upload</button><button type="button" class="btn sm" data-x="file-attach">${ic('clip')}From repository</button></div></section>`;

async function handleFileAction(k, x, target, afterChange) {
  if (k === 'file-open') openViewer(x.dataset.path);
  else if (k === 'file-detach') { const o = target(); if (o) { o.files = o.files.filter(p => p !== x.dataset.path); save(); afterChange(); } }
  else if (k === 'file-attach') pickFile({onPick: p => { const o = target(); if (o) { attachFiles(o, [p]); save(); afterChange(); } }});
  else if (k === 'file-upload') {

    const files = await chooseFiles(); if (!files.length) return;

function openLogSheet(stepId) {

      <div class="full sheet-actions" style="margin-top:4px"><button type="button" class="btn" data-x="cancel">Cancel</button><button class="btn primary">Add to build log</button></div></form>
      <p class="sheet-hint">Saved as a commit to <span class="mono">${esc(state.settings.logPath)}</span>.${imgs.length ? '' : ' Upload photos to the step first to include them.'}</p>`;
    const labels = $$('.log-img', inner);
    labels.forEach((l, i) => { l.dataset.i = i; });
    imgs.forEach((p, i) => {
      const it = T.items.get(p);

      e.preventDefault();

      const logPath = state.settings.logPath, logDir = dirName(logPath);
      const lines = [`## ${v('lg-date') || todayISO()} — ${v('lg-title') || s.title}`, `**Worked on:** ${v('lg-did').replace(/\n+/g, ' ')}`, `**Time spent:** ${v('lg-time')}`, `**What went well:** ${v('lg-good').replace(/\n+/g, ' ')}`, `**Problems / what I learned:** ${v('lg-bad').replace(/\n+/g, ' ')}`, `**Next steps:** ${v('lg-next').replace(/\n+/g, ' ')}`];

      const btn = $('button.primary', inner); btn.disabled = true; btn.textContent = 'Saving…';
      try {
        await loadTree();
        const it = T.items.get(logPath);

        text = text.replace(/\s*$/, '\n') + '\n---\n\n' + entryText;

    });
  }, {cls: 'tall'});
}

/* ================= event delegation ================= */
let suppressUntil = 0;
document.addEventListener('click', e => { if (performance.now() < suppressUntil) { e.preventDefault(); e.stopPropagation(); } }, true);
document.addEventListener('click', async e => {
  if (e.target.closest('#layer')) return;
  const view = e.target.closest('[data-view]');
  if (view) { setView(view.dataset.view); return; }
  const actEl = e.target.closest('[data-act]');
  const act = actEl && actEl.dataset.act;
  if (act === 'settings') return openSettings();
  if (act === 'sync') return GH.status === 'off' ? openConnect() : openSettings();
  if (act === 'connect') return openConnect();
  if (act === 'composer-add') return composerSubmit();
  if (act === 'composer-close') { composing = null; render(); return; }

  /* blocks */
  const stepEl = e.target.closest('.step');
  if (act === 'step-cycle' && stepEl) { const s = findStep(stepEl.dataset.step); if (s) { setStepStatus(s.step.id, NEXT_STATUS[s.step.status]); save(); render(); } return; }
  const blockEl = e.target.closest('.block');
  if (act === 'block-toggle' && blockEl) { const b = findBlock(blockEl.dataset.block); b.collapsed = !b.collapsed; save(); render(); return; }
  if (act === 'block-edit' && blockEl) return openBlockEdit(blockEl.dataset.block);
  if (act === 'block-menu' && blockEl) return blockMenu(actEl, blockEl.dataset.block);
  if (act === 'step-add' && blockEl) { composing = {kind: 'step', block: blockEl.dataset.block, text: ''}; render(); return; }
  if (act === 'block-add') {
    const name = await promptText({title: 'New block', label: 'Name', placeholder: 'e.g. Jetpack', confirm: 'Create'});
    if (!name) return;
    const b = newBlock(name, COLORS[state.blocks.length % COLORS.length]);
    state.blocks.push(b); composing = {kind: 'step', block: b.id, text: ''}; save(); render();
    return;
  }
  if (stepEl && !actEl) return openStep(stepEl.dataset.step);

  /* board */
  const cardEl = e.target.closest('#board .card');
  if (act === 'card-check' && cardEl) { const f = findCard(cardEl.dataset.card); if (f) { setCardDone(f.card.id, !f.card.done); save(); render(); } return; }
  if (cardEl) return openCard(cardEl.dataset.card);
  const tab = e.target.closest('.tab[data-board]');
  if (tab) { if (tab.dataset.board === curBoard().id) boardMenu(tab); else { ui.board = tab.dataset.board; saveUI(); composing = null; render(); } return; }
  if (act === 'board-add') {
    const name = await promptText({title: 'New board', label: 'Name', placeholder: 'e.g. Electronics', confirm: 'Create'});
    if (!name) return;
    const b = {id: uid(), name, color: COLORS[state.boards.length % COLORS.length], lists: [newList('To do'), newList('Doing'), newList('Done', {isDone: true})]};
    state.boards.push(b); ui.board = b.id; saveUI(); save(); render();
    return;
  }
  const listEl = e.target.closest('#board .list');
  if (act === 'list-add') { composing = {kind: 'list', text: ''}; render(); return; }
  if (act === 'card-add' && listEl) { composing = {kind: 'card', list: listEl.dataset.list, text: ''}; render(); return; }

    state.blocks.sort((a, b) => order.indexOf(a.id) - order.indexOf(b.id));
  }
}
function endDrag() {
  const d = drag; drag = null;
  cancelAnimationFrame(d.raf);
  suppressUntil = performance.now() + 400;
  if (d.hover) d.hover.classList.remove('is-drop');
  document.documentElement.classList.remove('dragging');
  try { commitDrop(d); } catch (err) { console.error('Drop failed', err); }
  save();
  const r = d.el.getBoundingClientRect();
  const finish = () => { d.ghost.remove(); settling = false; render(); };
  if (reduceMotion.matches || !r.width) { finish(); return; }
  settling = true;
  d.ghost.classList.add('settling');
  d.ghost.style.transform = `translate3d(${r.left}px, ${r.top}px, 0)`;
  setTimeout(finish, 170);
}

/* ================= boot ================= */
applyTheme();
ghLoadCfg();
render();
if (GH.status === 'on') { ghPull(); if (ui.view === 'files') loadTree().catch(() => {}); }
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
window.rexDebug = {get state() { return state; }, T, GH, render, commitChanges, loadTree};
</script>
